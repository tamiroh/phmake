php-version = "8.5.0"

[source]
workspace = "."
paths = ["phmake", "src/", "tests/"]
includes = ["vendor"]
excludes = []

[formatter]
empty-line-after-property = true
sort-class-methods = true
print-width = 120
tab-width = 4
use-tabs = false

[linter]
integrations = ["phpunit"]

[linter.rules]
ambiguous-function-call = { enabled = true }
cyclomatic-complexity = { enabled = false }
kan-defect = { enabled = false }
too-many-methods = { exclude = ["tests/**", "src/Makefile/Evaluation/Functions.php"] }
excessive-parameter-list = { enabled = false }
no-error-control-operator = { enabled = false }
halstead = { effort-threshold = 7000 }

[analyzer]
plugins = []
find-unused-definitions = true
find-unused-expressions = true
analyze-dead-code = true
memoize-properties = true
allow-possibly-undefined-array-keys = false # TODO: remove
# strict-array-index-existence = true # TODO: enable
check-throws = true
unchecked-exceptions = ["LogicException", "RuntimeException"]
check-missing-override = true
find-unused-parameters = true
strict-list-index-checks = true
no-boolean-literal-comparison = true
check-missing-type-hints = true
register-super-globals = true

# Dependency boundaries: Console -> Parser -> Makefile.
[guard]
mode = "perimeter"

[[guard.perimeter.rules]]
namespace = "@global"
permit = ["@native", 'Tamiroh\Phmake\Console\Application']

[[guard.perimeter.rules]]
namespace = 'Tamiroh\Phmake\Makefile\'
permit = ["@self", "@native", 'Tamiroh\Phmake\Makefile\**']

[[guard.perimeter.rules]]
namespace = 'Tamiroh\Phmake\Parser\'
permit = ["@self", "@native", 'Tamiroh\Phmake\Makefile\**']

[[guard.perimeter.rules]]
namespace = 'Tamiroh\Phmake\Console\'
permit = ["@self", "@native", 'Tamiroh\Phmake\Makefile\**', 'Tamiroh\Phmake\Parser\**', 'Symfony\Component\Process\**']

[[guard.perimeter.rules]]
namespace = 'Tamiroh\Phmake\Tests\'
permit = ["@all"]

# Native functions are generally allowed, but domain objects must use execution interfaces.
[[guard.perimeter.restrictions]]
dependency = '**\fwrite'
deny-from = ['Tamiroh\Phmake\Makefile\']

[[guard.perimeter.restrictions]]
dependency = '**\shell_exec'
deny-from = ['Tamiroh\Phmake\Makefile\']

[[guard.perimeter.restrictions]]
dependency = '**\proc_open'
deny-from = ['Tamiroh\Phmake\Makefile\']
