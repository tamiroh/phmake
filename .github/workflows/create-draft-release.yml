name: Create draft release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Calculate release version
        id: version
        uses: reecetech/version-increment@2026.8.4
        with:
          scheme: semver
          increment: ${{ inputs.bump }}
          release_branch: ${{ github.ref_name }}
          tag_prefix: v
          use_api: true

      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.5'
          extensions: pcntl, posix, ffi
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress --no-scripts

      - name: Build and verify PHAR
        env:
          RELEASE_TAG: ${{ steps.version.outputs.v-version }}
        run: |
          make phar VERSION="$RELEASE_TAG"
          make test-phar VERSION="$RELEASE_TAG"

      - name: Create or update draft release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.v-version }}
        shell: bash
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [ "$draft" != true ]; then
              echo 'Refusing to change an already published release.' >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA"
            gh release upload "$RELEASE_TAG" dist/phmake.phar --clobber
          else
            gh release create "$RELEASE_TAG" dist/phmake.phar --target "$GITHUB_SHA" --draft --generate-notes --title "$RELEASE_TAG"
          fi
