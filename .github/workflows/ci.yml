name: CI

on: [push, pull_request]

jobs:
  build-php:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare PHP build environment
        run: docker build --platform linux/amd64 -f e2e/php/Dockerfile -t phmake-php-build .

      - name: Build and verify PHP with phmake
        run: docker run --rm --platform linux/amd64 phmake-php-build

  build-lua:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Lua build environment
        run: docker build --platform linux/amd64 -f e2e/lua/Dockerfile -t phmake-lua-build .

      - name: Build and verify Lua with phmake
        run: docker run --rm --platform linux/amd64 phmake-lua-build

  build-make:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare GNU make build environment
        run: docker build --platform linux/amd64 -f e2e/make/Dockerfile -t phmake-make-build .

      - name: Build and verify GNU make with phmake
        run: docker run --rm --platform linux/amd64 phmake-make-build

  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Linux build environment
        run: docker build --platform linux/amd64 -f e2e/linux/Dockerfile -t phmake-linux-build .

      - name: Build and boot Linux with phmake
        run: docker run --rm --platform linux/amd64 --network none phmake-linux-build

  test-gnu-make:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare GNU make test environment
        run: docker build --platform linux/amd64 -f e2e/make/Dockerfile -t phmake-make-build .

      - name: Run GNU make test suite against phmake
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gnu-make-tests"
          docker run --rm --platform linux/amd64 --network none --user nobody \
            phmake-make-build sh /usr/local/bin/run-gnu-make-tests \
            2>&1 | tee "$RUNNER_TEMP/gnu-make-tests/run.log"

      - name: Summarize GNU make test results
        if: always()
        shell: bash
        run: |
          {
            echo '### GNU make compatibility tests'
            echo '```text'
            if ! grep -E '^(Summary:|Categories:)' "$RUNNER_TEMP/gnu-make-tests/run.log"; then
              echo 'The suite did not reach its summary. Check the job log.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: '8.5'
          extensions: pcntl, posix

      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction --no-progress --no-scripts

      - name: Run lint
        run: make lint

      - name: Run Mago format check
        run: make format-check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: '8.5'
          extensions: pcntl, posix

      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction --no-progress --no-scripts

      - name: Run tests
        run: make test
