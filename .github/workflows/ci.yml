name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: '8.5'

      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction --no-progress --no-scripts

      - name: Run lint
        run: make lint

      - name: Run Mago format check
        run: make format-check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: '8.5'

      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction --no-progress --no-scripts

      - name: Run tests
        run: make test
