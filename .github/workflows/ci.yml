name: CI

on: [push, pull_request]

jobs:
  build-php:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare PHP build environment
        run: docker build --platform linux/amd64 -f e2e/php/Dockerfile -t phmake-php-build .

      - name: Compare PHP builds with GNU make and phmake
        run: python3 e2e/compare-builds.py php

  build-lua:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Lua build environment
        run: docker build --platform linux/amd64 -f e2e/lua/Dockerfile -t phmake-lua-build .

      - name: Compare Lua builds with GNU make and phmake
        run: python3 e2e/compare-builds.py lua

  build-make:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare GNU make build environment
        run: docker build --platform linux/amd64 -f e2e/make/Dockerfile -t phmake-make-build .

      - name: Compare GNU make builds with GNU make and phmake
        run: python3 e2e/compare-builds.py make

  build-git:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Git build environment
        run: docker build --platform linux/amd64 -f e2e/git/Dockerfile -t phmake-git-build .

      - name: Compare Git builds with GNU make and phmake
        run: python3 e2e/compare-builds.py git

  build-ffmpeg:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare FFmpeg build environment
        run: docker build --platform linux/amd64 -f e2e/ffmpeg/Dockerfile -t phmake-ffmpeg-build .

      - name: Compare FFmpeg builds with GNU make and phmake
        run: python3 e2e/compare-builds.py ffmpeg

  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Linux build environment
        run: docker build --platform linux/amd64 -f e2e/linux/Dockerfile -t phmake-linux-build .

      - name: Compare Linux builds with GNU make and phmake
        run: python3 e2e/compare-builds.py linux

  test-gnu-make:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare GNU make test environment
        run: docker build --platform linux/amd64 -f e2e/make/Dockerfile -t phmake-make-build .

      - name: Validate the test environment with GNU make
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gnu-make-tests"
          docker run --rm --init --platform linux/amd64 --network none --user nobody \
            phmake-make-build sh /usr/local/bin/run-gnu-make-tests --reference \
            2>&1 | tee "$RUNNER_TEMP/gnu-make-tests/reference.log"

      - name: Run GNU make test suite against phmake
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gnu-make-tests"
          docker run --rm --init --platform linux/amd64 --network none --user nobody \
            phmake-make-build sh /usr/local/bin/run-gnu-make-tests \
            2>&1 | tee "$RUNNER_TEMP/gnu-make-tests/run.log"

      - name: Summarize GNU make test results
        if: always()
        shell: bash
        run: |
          {
            for suite in reference run; do
              echo "### GNU make tests: $suite"
              echo '```text'
              if ! grep -E '^(Summary:|Categories:)' "$RUNNER_TEMP/gnu-make-tests/$suite.log"; then
                echo 'The suite did not reach its summary. Check the job log.'
              fi
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: '8.5'
          extensions: pcntl, posix

      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction --no-progress --no-scripts

      - name: Run lint
        run: make lint

      - name: Run Mago format check
        run: make format-check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: '8.5'
          extensions: pcntl, posix

      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction --no-progress --no-scripts

      - name: Run tests
        run: make test
