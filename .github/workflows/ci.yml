name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  git-footprint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install git-footprint
        run: go install github.com/tamiroh/git-footprint@latest

      - name: Check repository footprint
        run: |
          git footprint --no-color --no-pager --fail-on info \
            --allow-identity 'tamiroh <tamiroh71@gmail.com>' \
            --allow-identity 'tamiroh <79360511+tamiroh@users.noreply.github.com>' \
            --allow-identity 'GitHub <noreply@github.com>' \
            --allow-identity 'dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>' \
            --allow-identity 'dependabot[bot] <support@github.com>' \
            --allow-identity 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>' \
            --allow-identity 'Copilot <175728472+copilot@users.noreply.github.com>' \
            --allow-identity 'copilot-swe-agent[bot] <198982749+Copilot@users.noreply.github.com>'

  build-php:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Prepare PHP build environment
        run: docker build --platform linux/amd64 -f e2e/php/Dockerfile -t phmake-php-build .

      - name: Compare PHP builds with GNU make and phmake
        id: compare
        run: python3 e2e/compare-builds.py php "$RUNNER_TEMP/build-results.json"

      - name: Summarize PHP build comparison
        if: ${{ !cancelled() && steps.compare.outcome != 'skipped' }}
        run: python3 e2e/summarize-builds.py "$RUNNER_TEMP/build-results.json"

      - name: Upload PHP build comparison
        if: ${{ !cancelled() && steps.compare.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-results-php
          path: ${{ runner.temp }}/build-results.json

  build-lua:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Prepare Lua build environment
        run: docker build --platform linux/amd64 -f e2e/lua/Dockerfile -t phmake-lua-build .

      - name: Compare Lua builds with GNU make and phmake
        id: compare
        run: python3 e2e/compare-builds.py lua "$RUNNER_TEMP/build-results.json"

      - name: Summarize Lua build comparison
        if: ${{ !cancelled() && steps.compare.outcome != 'skipped' }}
        run: python3 e2e/summarize-builds.py "$RUNNER_TEMP/build-results.json"

      - name: Upload Lua build comparison
        if: ${{ !cancelled() && steps.compare.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-results-lua
          path: ${{ runner.temp }}/build-results.json

  build-make:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Prepare GNU make build environment
        run: docker build --platform linux/amd64 -f e2e/make/Dockerfile -t phmake-make-build .

      - name: Compare GNU make builds with GNU make and phmake
        id: compare
        run: python3 e2e/compare-builds.py make "$RUNNER_TEMP/build-results.json"

      - name: Summarize GNU make build comparison
        if: ${{ !cancelled() && steps.compare.outcome != 'skipped' }}
        run: python3 e2e/summarize-builds.py "$RUNNER_TEMP/build-results.json"

      - name: Upload GNU make build comparison
        if: ${{ !cancelled() && steps.compare.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-results-make
          path: ${{ runner.temp }}/build-results.json

  build-git:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Prepare Git build environment
        run: docker build --platform linux/amd64 -f e2e/git/Dockerfile -t phmake-git-build .

      - name: Compare Git builds with GNU make and phmake
        id: compare
        run: python3 e2e/compare-builds.py git "$RUNNER_TEMP/build-results.json"

      - name: Summarize Git build comparison
        if: ${{ !cancelled() && steps.compare.outcome != 'skipped' }}
        run: python3 e2e/summarize-builds.py "$RUNNER_TEMP/build-results.json"

      - name: Upload Git build comparison
        if: ${{ !cancelled() && steps.compare.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-results-git
          path: ${{ runner.temp }}/build-results.json

  build-ffmpeg:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Prepare FFmpeg build environment
        run: docker build --platform linux/amd64 -f e2e/ffmpeg/Dockerfile -t phmake-ffmpeg-build .

      - name: Compare FFmpeg builds with GNU make and phmake
        id: compare
        run: python3 e2e/compare-builds.py ffmpeg "$RUNNER_TEMP/build-results.json"

      - name: Summarize FFmpeg build comparison
        if: ${{ !cancelled() && steps.compare.outcome != 'skipped' }}
        run: python3 e2e/summarize-builds.py "$RUNNER_TEMP/build-results.json"

      - name: Upload FFmpeg build comparison
        if: ${{ !cancelled() && steps.compare.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-results-ffmpeg
          path: ${{ runner.temp }}/build-results.json

  build-gcc:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Prepare GCC build environment
        run: docker build --platform linux/amd64 -f e2e/gcc/Dockerfile -t phmake-gcc-build .

      - name: Compare GCC builds with GNU make and phmake
        id: compare
        run: python3 e2e/compare-builds.py gcc "$RUNNER_TEMP/build-results.json"

      - name: Summarize GCC build comparison
        if: ${{ !cancelled() && steps.compare.outcome != 'skipped' }}
        run: python3 e2e/summarize-builds.py "$RUNNER_TEMP/build-results.json"

      - name: Upload GCC build comparison
        if: ${{ !cancelled() && steps.compare.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-results-gcc
          path: ${{ runner.temp }}/build-results.json

  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Prepare Linux build environment
        run: docker build --platform linux/amd64 -f e2e/linux/Dockerfile -t phmake-linux-build .

      - name: Compare Linux builds with GNU make and phmake
        id: compare
        run: python3 e2e/compare-builds.py linux "$RUNNER_TEMP/build-results.json"

      - name: Summarize Linux build comparison
        if: ${{ !cancelled() && steps.compare.outcome != 'skipped' }}
        run: python3 e2e/summarize-builds.py "$RUNNER_TEMP/build-results.json"

      - name: Upload Linux build comparison
        if: ${{ !cancelled() && steps.compare.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-results-linux
          path: ${{ runner.temp }}/build-results.json

  build-llama-cpp:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Prepare llama.cpp build environment
        run: docker build --platform linux/amd64 -f e2e/llama-cpp/Dockerfile -t phmake-llama-cpp-build .

      - name: Compare llama.cpp builds with GNU make and phmake
        id: compare
        run: python3 e2e/compare-builds.py llama-cpp "$RUNNER_TEMP/build-results.json"

      - name: Summarize llama.cpp build comparison
        if: ${{ !cancelled() && steps.compare.outcome != 'skipped' }}
        run: python3 e2e/summarize-builds.py "$RUNNER_TEMP/build-results.json"

      - name: Upload llama.cpp build comparison
        if: ${{ !cancelled() && steps.compare.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-results-llama-cpp
          path: ${{ runner.temp }}/build-results.json

  performance-check:
    needs: [build-php, build-lua, build-make, build-git, build-ffmpeg, build-linux, build-gcc, build-llama-cpp]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download build comparisons
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: build-results-*
          path: ${{ runner.temp }}/build-results

      - name: Check no-op rebuild times
        run: >-
          python3 e2e/check-no-op.py "$RUNNER_TEMP/build-results"
          lua=0.2 make=1 php=1.25 ffmpeg=1.6 git=6.5 llama-cpp=9 gcc=32 linux=90

  test-gnu-make:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Prepare GNU make test environment
        run: docker build --platform linux/amd64 -f e2e/make/Dockerfile -t phmake-make-build .

      - name: Validate the test environment with GNU make
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gnu-make-tests"
          docker run --rm --init --platform linux/amd64 --network none --user nobody \
            phmake-make-build sh /usr/local/bin/run-gnu-make-tests --reference \
            2>&1 | tee "$RUNNER_TEMP/gnu-make-tests/reference.log"

      - name: Run GNU make test suite against phmake
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gnu-make-tests"
          docker run --rm --init --platform linux/amd64 --network none --user nobody \
            phmake-make-build sh /usr/local/bin/run-gnu-make-tests \
            2>&1 | tee "$RUNNER_TEMP/gnu-make-tests/run.log"

      - name: Summarize GNU make test results
        if: always()
        shell: bash
        run: |
          {
            for suite in reference run; do
              echo "### GNU make tests: $suite"
              echo '```text'
              if ! grep -E '^(Summary:|Categories:)' "$RUNNER_TEMP/gnu-make-tests/$suite.log"; then
                echo 'The suite did not reach its summary. Check the job log.'
              fi
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.5'
          extensions: pcntl, posix, ffi

      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction --no-progress --no-scripts

      - name: Run lint
        run: make lint

      - name: Run Mago format check
        run: make format-check

  test:
    # The parallel fixtures require atomic mkdir locking with GNU coreutils.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.5'
          extensions: pcntl, posix, ffi

      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction --no-progress --no-scripts

      - name: Install the compatibility reference
        run: |
          sh tools/install-gnu-make.sh "$RUNNER_TEMP/gnu-make"
          echo "GNU_MAKE=$RUNNER_TEMP/gnu-make/bin/make" >> "$GITHUB_ENV"

      - name: Run tests
        run: make test

  phar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.5'
          extensions: pcntl, posix, ffi
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress --no-scripts

      - name: Build and verify PHAR
        run: |
          make phar VERSION=v0.0.0-ci
          make test-phar VERSION=v0.0.0-ci
