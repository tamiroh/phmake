name: CI

on: [push, pull_request]

jobs:
  php-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare PHP build environment
        run: docker build --platform linux/amd64 -f e2e/php/Dockerfile -t phmake-php-build .

      - name: Build and verify PHP with phmake
        run: docker run --rm --platform linux/amd64 phmake-php-build

  lua-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Lua build environment
        run: docker build --platform linux/amd64 -f e2e/lua/Dockerfile -t phmake-lua-build .

      - name: Build and verify Lua with phmake
        run: docker run --rm --platform linux/amd64 phmake-lua-build

  make-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare GNU make build environment
        run: docker build --platform linux/amd64 -f e2e/make/Dockerfile -t phmake-make-build .

      - name: Build and verify GNU make with phmake
        run: docker run --rm --platform linux/amd64 phmake-make-build

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: '8.5'

      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction --no-progress --no-scripts

      - name: Run lint
        run: make lint

      - name: Run Mago format check
        run: make format-check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: '8.5'

      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction --no-progress --no-scripts

      - name: Run tests
        run: make test
